// android/build.gradle (프로젝트 루트 build.gradle)
buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"  // 또는 필요에 따라 최신 안정 버전으로 업데이트
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repository.map.naver.com/archive/maven' }
        maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build" &&
                    details.requested.name == "gradle") {
                details.useVersion "8.8.0-alpha05"
            }
        }
    }
}

plugins {
    id("com.facebook.react.rootproject")  apply false
    id("com.google.gms.google-services") version "4.4.2" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repository.map.naver.com/archive/maven' }
        maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    }
}
