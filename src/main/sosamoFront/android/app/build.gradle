apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * React Native Android 앱 설정 블록
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Proguard 사용 여부 (릴리즈 빌드 시)
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore(JSC) flavor 설정 (여기서는 기본 JSC 사용)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sosamofront"
    defaultConfig {
        applicationId "com.sosamofront"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native 의존성은 React Native Gradle Plugin에 의해 관리됩니다.
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    // SoLoader: React Native 0.75와 호환되는 버전 (예: 0.10.1)
    implementation("com.facebook.soloader:soloader:0.10.1")
    // 네이버 지도 SDK
    implementation 'com.naver.maps:map-sdk:3.18.0'

    implementation(platform("com.google.firebase:firebase-bom:33.10.0"))
    implementation("com.google.firebase:firebase-analytics")

    implementation "com.kakao.sdk:v2-all:2.20.6" // 전체 모듈 설치, 2.11.0 버전부터 지원
    implementation "com.kakao.sdk:v2-user:2.20.6" // 카카오 로그인 API 모듈
    implementation "com.kakao.sdk:v2-share:2.20.6" // 카카오톡 공유 API 모듈
    implementation "com.kakao.sdk:v2-talk:2.20.6" // 카카오톡 채널, 카카오톡 소셜, 카카오톡 메시지 API 모듈
    implementation "com.kakao.sdk:v2-friend:2.20.6" // 피커 API 모듈
    implementation "com.kakao.sdk:v2-navi:2.20.6" // 카카오내비 API 모듈
    implementation "com.kakao.sdk:v2-cert:2.20.6" // 카카오톡 인증 서비스 API 모듈
}